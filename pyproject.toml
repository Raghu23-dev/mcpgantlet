[project]
name = "mcpgantlet"
version = "0.5.0"
description = "MCP servers ship to production with no way to know whether they survive concurrent load or are safe."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raghuram P" }]
# Runtime dependencies, not dev extras: the CLI needs httpx to probe, and the deployed
# reference server needs fastapi. Declared here because Vercel's Python builder reads
# pyproject.toml — the same gap that failed onewayglass's first two deploys.
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.121,<0.142",
  # starlette is a TRANSITIVE dependency, pinned here on purpose.
  #
  # fastapi asks only for `starlette>=0.46.0`, so the resolver settled on 0.50.0 — which carries
  # seven advisories (PYSEC-2026-161, -248, -249, -2280, -2281), the newest fixed in 1.3.1. The
  # daily health workflow opened an issue for it; nothing in the direct dependency list was wrong,
  # which is exactly why a transitive floor has to be stated rather than inferred.
  #
  # A floor, not an equality pin: a pin would go stale into the next advisory and produce a weekly
  # red Dependabot PR that nobody merges.
  "starlette>=1.3.1",
]

[project.optional-dependencies]
# uvicorn is a DEV dependency because criterion 3 needs it: tests/correctness spins up the
# reference server in-process to prove the auditor reports zero false positives against a
# conforming target. It was undeclared, so `uv sync` did not install it, so that module
# failed to COLLECT and CI went red on every run including all three release tags — while
# passing locally, where an earlier manual `pip install uvicorn` had left it behind.
# The criterion the docs call "the one that makes the tool trustworthy" was never running.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "uvicorn>=0.32"]

[project.scripts]
mcpgantlet = "mcpgantlet.cli:main"

[tool.hatch.build.targets.wheel]
# Explicit because the package lives in src/ and does not match the project name at the repo
# root. Without it hatchling cannot infer what to ship. Never surfaced until a deploy, since
# nothing local built a wheel — `uv build --wheel` reproduces it in two seconds.
packages = ["src/mcpgantlet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The deployed landing page is one HTML/CSS literal; wrapping CSS to a column limit hurts it.
"api/index.py" = ["E501", "E402"]
# E402: imports must follow the sys.path setup that makes them resolvable. Moving them above it
# would break the module rather than tidy it.
"tests/deployment/*.py" = ["E402"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
# NOTE: in a file named pytest.ini this section must be [pytest]; inside
# pyproject.toml it must be [tool.pytest.ini_options]. Getting this wrong makes
# every setting here silently inert — a real bug observed in a production repo.
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
